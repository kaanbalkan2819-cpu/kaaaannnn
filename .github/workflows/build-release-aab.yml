name: Build RELEASE AAB (Google Play)
# Gerekli GitHub Secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   : worldconquest-upload.jks dosyasinin base64'u   (Linux/Mac: base64 -w0 worldconquest-upload.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS (upload), KEY_PASSWORD
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Imza anahtarini yaz
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "KEYSTORE_BASE64 secret tanimli degil"; exit 1; }
          echo "$KS_B64" | base64 -d > worldconquest-upload.jks
          printf 'storeFile=worldconquest-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
      - name: Imzali AAB uret
        run: node scripts/release_setup.js --build
      - uses: actions/upload-artifact@v4
        with:
          name: world-conquest-aab
          path: WorldConquest-*.aab
